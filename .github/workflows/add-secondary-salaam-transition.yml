name: One-time secondary Salaam transition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-secondary-salaam-transition.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply secondary Salaam transition
        run: python3 patch_secondary_salaam.py
      - name: Commit website update
        run: |
          git config user.name "umarvandutch"
          git config user.email "96899121+umarvandutch@users.noreply.github.com"
          git add index.html
          git commit -m "Add standalone Salaam transition and extend intro timing"
          git push
