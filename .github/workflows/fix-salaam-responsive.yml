name: One-time Salaam responsive fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-salaam-responsive.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply responsive Salaam viewport fix
        run: |
          python3 -c 'from pathlib import Path; import base64; p=Path("index.html"); s=p.read_text(encoding="utf-8"); marker="<style id=\"salaam-responsive-fit\">"; css=base64.b64decode("").decode("utf-8"); assert "</head>" in s; p.write_text(s if marker in s else s.replace("</head>",css+"</head>",1),encoding="utf-8")'
      - name: Commit fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "umarvandutch"
          git config user.email "96899121+umarvandutch@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Salaam layout across viewport sizes"
          git push
