name: One-time robust Salaam auto-fit fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-salaam-autofit-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply robust viewport auto-fit
        run: |
          python3 -c 'from pathlib import Path; import base64,re; p=Path("index.html"); s=p.read_text(encoding="utf-8"); s=re.sub(r"\n\s*<style id=\"salaam-responsive-fit\">.*?</style>\s*\n", "\n", s, count=1, flags=re.S); s=re.sub(r"\n\s*<style id=\"salaam-responsive-fit-v2\">.*?</style>\s*\n", "\n", s, count=1, flags=re.S); s=re.sub(r"\n\s*<script id=\"salaam-autofit-v2\">.*?</script>\s*\n", "\n", s, count=1, flags=re.S); css=base64.b64decode("").decode("utf-8"); js=base64.b64decode("").decode("utf-8"); assert "</head>" in s and "</body>" in s; s=s.replace("</head>",css+"</head>",1); s=s.replace("</body>",js+"</body>",1); p.write_text(s,encoding="utf-8")'
      - name: Commit fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "umarvandutch"
          git config user.email "96899121+umarvandutch@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Salaam with measured whole-composition auto-fit"
          git push
