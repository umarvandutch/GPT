name: Hard gateway ordering fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hard-gateway-lock.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hard gateway lock
        run: python3 patch_hard_gateway_lock.py
      - name: Commit fix and clean runner
        run: |
          git config user.name "umarvandutch"
          git config user.email "96899121+umarvandutch@users.noreply.github.com"
          git add index.html
          git rm patch_hard_gateway_lock.py .github/workflows/hard-gateway-lock.yml
          git commit -m "Hard-lock gateway until intro transitions finish"
          git push
